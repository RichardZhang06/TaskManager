<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Tasks</h1><span id="count"></span></header>
  <form id="form">
    <input id="input" placeholder="Add a task…" autocomplete="off" autofocus>
    <input id="due" type="date" title="Due date (optional)">
  </form>
  <nav id="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Done</button>
  </nav>
  <ul id="list"></ul>
  <footer><button id="clear">Clear completed</button></footer>
  <script src="renderer.js"></script>
</body>
</html>
